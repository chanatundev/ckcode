<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; style-src 'unsafe-inline'"
    />
    <title>Sidekick</title>
    <style>
      :root {
        --size: 136px;
        --gap: 10px;
        --panel-width: 280px;
        --panel-gap: 6px;
        --row-height: 32px;
        --row-padding: 0 10px 0 12px;
        --row-radius: 10px;
        --row-gap: 10px;
        --row-font-size: 12px;
        --status-font-size: 11px;
        --status-gap: 5px;
        --status-dot-size: 6px;
        --arrow-size: 9px;
        --more-height: 24px;
        --more-font-size: 11px;
        --more-radius: 10px;

        --surface: #ffffff;
        --surface-hover: #f4f4f5;
        --border: #e4e4e7;
        --foreground: #27272a;
        --muted-foreground: #71717a;
        --shadow: 0 4px 12px rgb(0 0 0 / 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #111111;
          --surface-hover: #1a1a1a;
          --border: rgb(255 255 255 / 0.08);
          --foreground: #f5f5f5;
          --muted-foreground: #8b8b8b;
          --shadow: 0 6px 16px rgb(0 0 0 / 0.55);
        }
      }
      body[data-size="small"],
      body.size-small {
        --panel-width: 240px;
        --panel-gap: 5px;
        --row-height: 28px;
        --row-padding: 0 9px 0 11px;
        --row-radius: 8px;
        --row-gap: 8px;
        --row-font-size: 11px;
        --status-font-size: 10px;
        --status-gap: 4px;
        --status-dot-size: 5px;
        --arrow-size: 8px;
        --more-height: 20px;
        --more-font-size: 10px;
        --more-radius: 8px;
      }
      body[data-size="medium"],
      body.size-medium {
        --panel-width: 280px;
        --panel-gap: 6px;
        --row-height: 32px;
        --row-padding: 0 10px 0 12px;
        --row-radius: 10px;
        --row-gap: 10px;
        --row-font-size: 12px;
        --status-font-size: 11px;
        --status-gap: 5px;
        --status-dot-size: 6px;
        --arrow-size: 9px;
        --more-height: 24px;
        --more-font-size: 11px;
        --more-radius: 10px;
      }
      body[data-size="large"],
      body.size-large {
        --panel-width: 340px;
        --panel-gap: 8px;
        --row-height: 40px;
        --row-padding: 0 14px 0 16px;
        --row-radius: 12px;
        --row-gap: 12px;
        --row-font-size: 14px;
        --status-font-size: 12.5px;
        --status-gap: 6px;
        --status-dot-size: 7px;
        --arrow-size: 11px;
        --more-height: 28px;
        --more-font-size: 12px;
        --more-radius: 12px;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font:
          var(--row-font-size, 12px) / 1.3 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      #sprite {
        position: absolute;
        inset: 0;
        container-type: size;
        cursor: grab;
      }
      body.dragging #sprite {
        cursor: grabbing;
      }
      /* While expanded the sprite keeps its corner; the list opens beside it. */
      body.expanded #sprite {
        inset: auto;
        width: var(--size);
        height: var(--size);
      }
      body.expanded.above #sprite {
        bottom: 0;
      }
      body.expanded.below #sprite {
        top: 0;
      }
      body.expanded.end #sprite {
        right: 0;
      }
      body.expanded.start #sprite {
        left: 0;
      }
      /* Every pose stays decoded so a state change is a single cross-fade. */
      .sprite {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        pointer-events: none;
        -webkit-user-drag: none;
        transition: opacity 150ms ease-out;
      }
      .sprite.active {
        opacity: 1;
      }
      #badge {
        position: absolute;
        top: 8%;
        right: 8%;
        display: none;
        min-width: 1.5em;
        height: 1.5em;
        padding: 0 0.4em;
        box-sizing: border-box;
        border-radius: 999px;
        background: #e5484d;
        color: white;
        font:
          600 max(11px, 9cqw) / 1.5em system-ui,
          sans-serif;
        text-align: center;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.35);
      }
      #badge.visible {
        display: block;
      }
      /* Laid out while hidden so the preload can measure it before expanding. */
      #panel {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--panel-width, 280px);
        display: flex;
        flex-direction: column;
        gap: var(--panel-gap, 6px);
        visibility: hidden;
      }
      body.expanded #panel {
        top: auto;
        left: auto;
        visibility: visible;
      }
      /* Most urgent sits nearest the sprite. */
      body.expanded.above #panel {
        bottom: calc(var(--size) + var(--gap));
        flex-direction: column-reverse;
      }
      body.expanded.below #panel {
        top: calc(var(--size) + var(--gap));
      }
      body.expanded.end #panel {
        right: 0;
      }
      body.expanded.start #panel {
        left: 0;
      }
      .session {
        position: relative;
        display: flex;
        align-items: center;
        gap: var(--row-gap, 10px);
        height: var(--row-height, 32px);
        padding: var(--row-padding, 0 10px 0 12px);
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: var(--row-radius, 10px);
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--foreground);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .session:hover {
        background: var(--surface-hover);
      }
      .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: var(--status-gap, 5px);
        color: var(--tone);
        font-size: var(--status-font-size, 11px);
        white-space: nowrap;
      }
      .status::before {
        content: "";
        width: var(--status-dot-size, 6px);
        height: var(--status-dot-size, 6px);
        border-radius: 50%;
        background: var(--dot);
      }
      /* Tailwind 600/500 in light, 300 in dark, as in the sidebar. */
      .session[data-state="approval"] {
        --tone: #d97706;
        --dot: #f59e0b;
      }
      .session[data-state="input"] {
        --tone: #4f46e5;
        --dot: #6366f1;
      }
      .session[data-state="error"] {
        --tone: #dc2626;
        --dot: #ef4444;
      }
      .session[data-state="plan"] {
        --tone: #7c3aed;
        --dot: #8b5cf6;
      }
      .session[data-state="working"] {
        --tone: #0284c7;
        --dot: #0ea5e9;
      }
      .session[data-state="success"] {
        --tone: #059669;
        --dot: #10b981;
      }
      @media (prefers-color-scheme: dark) {
        .session[data-state="approval"] {
          --tone: rgb(252 211 77 / 0.9);
          --dot: rgb(252 211 77 / 0.9);
        }
        .session[data-state="input"] {
          --tone: rgb(165 180 252 / 0.9);
          --dot: rgb(165 180 252 / 0.9);
        }
        .session[data-state="error"] {
          --tone: rgb(252 165 165 / 0.9);
          --dot: rgb(252 165 165 / 0.9);
        }
        .session[data-state="plan"] {
          --tone: rgb(196 181 253 / 0.9);
          --dot: rgb(196 181 253 / 0.9);
        }
        .session[data-state="working"] {
          --tone: rgb(125 211 252 / 0.8);
          --dot: rgb(125 211 252 / 0.8);
        }
        .session[data-state="success"] {
          --tone: rgb(110 231 183 / 0.9);
          --dot: rgb(110 231 183 / 0.9);
        }
      }
      /* Points from the nearest box at the sprite's center. */
      body.expanded .session:first-child::after {
        content: "";
        position: absolute;
        width: var(--arrow-size, 9px);
        height: var(--arrow-size, 9px);
        border: 1px solid var(--border);
        background: inherit;
        transform: rotate(45deg);
      }
      body.expanded.above .session:first-child::after {
        bottom: calc(var(--arrow-size, 9px) * -0.5 - 1px);
        border-top: none;
        border-left: none;
      }
      body.expanded.below .session:first-child::after {
        top: calc(var(--arrow-size, 9px) * -0.5 - 1px);
        border-right: none;
        border-bottom: none;
      }
      body.expanded.end .session:first-child::after {
        right: calc(var(--size) / 2 - var(--arrow-size, 9px) / 2);
      }
      body.expanded.start .session:first-child::after {
        left: calc(var(--size) / 2 - var(--arrow-size, 9px) / 2);
      }
      .more {
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--more-height, 24px);
        border: 1px solid var(--border);
        border-radius: var(--more-radius, 10px);
        box-sizing: border-box;
        background: var(--surface);
        color: var(--muted-foreground);
        font-size: var(--more-font-size, 11px);
        text-align: center;
      }
    </style>
  </head>
  <body data-size="medium">
    <div id="panel"></div>
    <div id="sprite">
      <img class="sprite" data-state="approval" src="approval.webp" alt="" />
      <img class="sprite" data-state="input" src="input.webp" alt="" />
      <img class="sprite" data-state="error" src="error.webp" alt="" />
      <img class="sprite" data-state="plan" src="plan.webp" alt="" />
      <img class="sprite" data-state="working" src="working.webp" alt="" />
      <img class="sprite" data-state="success" src="success.webp" alt="" />
      <img class="sprite active" data-state="waiting" src="waiting.webp" alt="" />
      <img class="sprite" data-state="sleeping" src="sleeping.webp" alt="" />
      <img class="sprite" data-state="offline" src="offline.webp" alt="" />
      <div id="badge"></div>
    </div>
  </body>
</html>
