<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file:; style-src 'unsafe-inline'"
    />
    <title>Sidekick</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font:
          12px / 1.3 system-ui,
          sans-serif;
      }
      #sprite {
        position: absolute;
        inset: 0;
        container-type: size;
        cursor: grab;
      }
      body.dragging #sprite {
        cursor: grabbing;
      }
      /* While expanded the sprite keeps its corner; the list opens beside it. */
      body.expanded #sprite {
        inset: auto;
        width: var(--size);
        height: var(--size);
      }
      body.expanded.above #sprite {
        bottom: 0;
      }
      body.expanded.below #sprite {
        top: 0;
      }
      body.expanded.end #sprite {
        right: 0;
      }
      body.expanded.start #sprite {
        left: 0;
      }
      /* Every pose stays decoded so a state change is a single cross-fade. */
      .sprite {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        pointer-events: none;
        -webkit-user-drag: none;
        transition: opacity 150ms ease-out;
      }
      .sprite.active {
        opacity: 1;
      }
      #badge {
        position: absolute;
        top: 8%;
        right: 8%;
        display: none;
        min-width: 1.5em;
        height: 1.5em;
        padding: 0 0.4em;
        box-sizing: border-box;
        border-radius: 999px;
        background: #e5484d;
        color: white;
        font:
          600 max(11px, 9cqw) / 1.5em system-ui,
          sans-serif;
        text-align: center;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.35);
      }
      #badge.visible {
        display: block;
      }
      /* Laid out while hidden so the preload can measure it before expanding. */
      #panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 280px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        visibility: hidden;
      }
      body.expanded #panel {
        top: auto;
        left: auto;
        visibility: visible;
      }
      /* Most urgent sits nearest the sprite. */
      body.expanded.above #panel {
        bottom: calc(var(--size) + var(--gap));
        flex-direction: column-reverse;
      }
      body.expanded.below #panel {
        top: calc(var(--size) + var(--gap));
      }
      body.expanded.end #panel {
        right: 0;
      }
      body.expanded.start #panel {
        left: 0;
      }
      .session {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 8px 0 12px;
        box-sizing: border-box;
        border: 1px solid rgb(255 255 255 / 0.08);
        border-radius: 10px;
        background: rgb(31 36 48 / 0.96);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.35);
        color: #e6e9ef;
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        cursor: pointer;
      }
      .session:hover {
        background: rgb(42 48 62 / 0.98);
      }
      .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgb(var(--tone) / 0.18);
        color: rgb(var(--tone));
        font-size: 11px;
        white-space: nowrap;
      }
      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .session[data-state="approval"] {
        --tone: 252 211 77;
        border-color: rgb(245 158 11 / 0.55);
      }
      .session[data-state="input"] {
        --tone: 216 180 254;
        border-color: rgb(168 85 247 / 0.55);
      }
      .session[data-state="error"] {
        --tone: 252 165 165;
        border-color: rgb(239 68 68 / 0.55);
      }
      .session[data-state="plan"] {
        --tone: 94 234 212;
      }
      .session[data-state="working"] {
        --tone: 147 197 253;
      }
      .session[data-state="success"] {
        --tone: 134 239 172;
      }
      /* Points from the nearest box at the sprite's center. */
      body.expanded .session:first-child::after {
        content: "";
        position: absolute;
        width: 9px;
        height: 9px;
        border: inherit;
        background: inherit;
        transform: rotate(45deg);
      }
      body.expanded.above .session:first-child::after {
        bottom: -5.5px;
        border-top: none;
        border-left: none;
      }
      body.expanded.below .session:first-child::after {
        top: -5.5px;
        border-right: none;
        border-bottom: none;
      }
      body.expanded.end .session:first-child::after {
        right: calc(var(--size) / 2 - 5px);
      }
      body.expanded.start .session:first-child::after {
        left: calc(var(--size) / 2 - 5px);
      }
      .more {
        height: 24px;
        border: 1px solid rgb(255 255 255 / 0.08);
        border-radius: 12px;
        box-sizing: border-box;
        background: rgb(31 36 48 / 0.92);
        color: #8a93a6;
        font-size: 11px;
        line-height: 22px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="sprite">
      <img class="sprite" data-state="approval" src="approval.webp" alt="" />
      <img class="sprite" data-state="input" src="input.webp" alt="" />
      <img class="sprite" data-state="error" src="error.webp" alt="" />
      <img class="sprite" data-state="plan" src="plan.webp" alt="" />
      <img class="sprite" data-state="working" src="working.webp" alt="" />
      <img class="sprite" data-state="success" src="success.webp" alt="" />
      <img class="sprite active" data-state="waiting" src="waiting.webp" alt="" />
      <img class="sprite" data-state="sleeping" src="sleeping.webp" alt="" />
      <img class="sprite" data-state="offline" src="offline.webp" alt="" />
      <div id="badge"></div>
    </div>
  </body>
</html>
